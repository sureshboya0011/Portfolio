# The Docker image that will be used to build your app
stages:
  - build
  - deploy
build:
  stage: build
  script:
    - echo "Starting build..."
    - mkdir -p public
    - echo "Build complete" > public/index.html
    - cat public/index.html

deploy:
  stage: deploy
  script:
    - echo "Deploying application..."
    - mkdir -p deployed
    - cp -r public/* deployed/
    - echo "Deployement complete"   
